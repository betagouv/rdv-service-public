    shortDescription: |-
      outil permettant aux usagers de prendre RDV avec les administrations
    longDescription: |
      RDV Service Public est un outil permettant aux usagers de prendre RDV avec les administrations.

      Il a pour objectif de :
      - simplifier la prise de RDV pour les usagers (notamment avec la prise de RDV en ligne)
      - notifier les usagers des rendez-vous pris (par mail et SMS)
      - permettre aux agents de gérer les RDV pris
      - s’interconnecter avec d’autres outils de l’État et des collectivités

      Il doit être générateur d’efficience, tout en garantissant l’autonomie personnelle des utilisateurs. Le choix des priorités de développement est donc guidé par les retours des ses utilisateurs (usagers et agents administratifs).
    genericName: Gestionnaire de RDV
    features:
      - réaliser une prise de RDV en ligne
      - gérer les RDV pris
      - notifier les usagers des RDV pris
