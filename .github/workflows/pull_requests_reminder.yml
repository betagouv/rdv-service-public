name: Pull Requests Reminder
permissions:
  pull-requests: read
on:
  schedule:
    - cron: "0 8 * * 1-4"
  workflow_dispatch:

jobs:
  pull-request-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Pull requests reminder
        uses: betagouv/pr-reviews-reminder-action@fb8f561286f429438f50092f8f0101150c085759 # master
        env:
          GITHUB_TOKEN: ${{ secrets.PR_REMINDER_GH_TOKEN }}
        with:
          webhook-url: ${{ secrets.PR_REMINDER_WEBHOOK_URL }}
          provider: slack
          github-provider-map: "francois-ferrandis:francois.ferrandis,victormours:victor.mours,aminedhobb:amine.dhobb,Holist:romain.neuville,AntoineGirard:agd,Teodora-Stanki:teodora.stankiewicz,mekaidmekaid:mekaid"
          channel: "startup-rdv-dev"
