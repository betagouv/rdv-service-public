name: CI
# Cette ligne permet de ne donner aucune permission au GITHUB_TOKEN associé au job qui tourne.
# On n'utilise pas du tout l'api github dans notre CI (aucun job n'a du code qui va créer des issues ou éditer le wiki du repo), donc on n'en a pas besoin.
permissions: {}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
jobs:
  rubocop:
    name: Ruby linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rubocop --parallel
  lint_slim:
    name: Slim Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec slim-lint app/views/
  lint_prettier:
    name: Lint SCSS with Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Cache js dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: node_modules-${{ hashFiles('yarn.lock') }}
          path: node_modules
      - run: yarn install --immutable
      - run: yarn run prettier --check .
  brakeman:
    name: Security Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec brakeman
  active_record_doctor:
    name: active_record_doctor
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: lapin_development
          POSTGRES_PASSWORD: lapin_development
          POSTGRES_DB: lapin_development
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run active_record_doctor:missing_foreign_keys
        run: bundle exec rails active_record_doctor:missing_foreign_keys
        env:
          HOST: http://example.com
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_development
          POSTGRES_PASSWORD: lapin_development
          POSTGRES_DB: lapin_development
      - name: Run active_record_doctor:missing_non_null_constraint
        run: bundle exec rails active_record_doctor:missing_non_null_constraint
        env:
          HOST: http://example.com
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_development
          POSTGRES_PASSWORD: lapin_development
          POSTGRES_DB: lapin_development
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # optimise la concurrence permise par GitHub : 20 jobs * 4cpu chacun
        # 3 patterns (unit / e2e agent / e2e rest) * 3 shard (_1, _2, _3) = 9 jobs (on laisse de la place pour les ~7 autres)
        # 4 groupes parallel ("1,2,3,4") = 4 processes
        name:
          [
            unit_1,
            unit_2,
            unit_3,
            feature_agents_1,
            feature_agents_2,
            feature_agents_3,
            feature_rest_1,
            feature_rest_2,
            feature_rest_3,
          ]
        include:
          - pattern: "spec/(?!features)"
            only_group: "1,2,3,4"
            name: unit_1
            sibling_names: [unit_2, unit_3]
          - pattern: "spec/(?!features)"
            only_group: "5,6,7,8"
            name: unit_2
            sibling_names: [unit_1, unit_3]
          - pattern: "spec/(?!features)"
            only_group: "9,10,11,12"
            name: unit_3
            sibling_names: [unit_1, unit_2]
          - pattern: "spec/features/agents"
            only_group: "1,2,3,4"
            name: feature_agents_1
            sibling_names: [feature_agents_2, feature_agents_3]
          - pattern: "spec/features/agents"
            only_group: "5,6,7,8"
            name: feature_agents_2
            sibling_names: [feature_agents_1, feature_agents_3]
          - pattern: "spec/features/agents"
            only_group: "9,10,11,12"
            name: feature_agents_3
            sibling_names: [feature_agents_1, feature_agents_2]
          - pattern: "spec/features/(?!(agents|autodoc))"
            only_group: "1,2,3,4"
            name: feature_rest_1
            sibling_names: [feature_rest_2, feature_rest_3]
          - pattern: "spec/features/(?!(agents|autodoc))"
            only_group: "5,6,7,8"
            name: feature_rest_2
            sibling_names: [feature_rest_1, feature_rest_3]
          - pattern: "spec/features/(?!(agents|autodoc))"
            only_group: "9,10,11,12"
            name: feature_rest_3
            sibling_names: [feature_rest_1, feature_rest_2]
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Prevent https://github.com/rails/rails/issues/53661
        run: touch tmp/local_secret.txt && openssl rand -hex 64 > tmp/local_secret.txt
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Cache js dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: node_modules-${{ hashFiles('yarn.lock') }}
          path: node_modules
      - name: Install JS dependencies
        run: yarn install --immutable
      - name: Cache precompiled assets
        id: cache-precompiled-assets
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: assets-invalid-${{ hashFiles('yarn.lock', 'Gemfile.lock', 'app/javascript/**', 'app/assets/**') }}
          path: |
            app/assets/builds
            public/assets
      - uses: ./.github/actions/setup-playwright
      - name: Precompile assets
        if: steps.cache-precompiled-assets.outputs.cache-hit != 'true' # Skip if cache was restored
        run: RAILS_ENV=test bundle exec rails assets:precompile
      - name: Prepare runtime log cache key
        run: "find spec -name '*_spec.rb' | grep -P '${{ matrix.pattern }}' > tmp/spec_${{ matrix.name }}_files.txt || true"
      - name: Restore first sibling's runtime log
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: specs-runtime-log-${{ matrix.sibling_names[0] }}-${{ hashFiles(format('tmp/spec_{0}_files.txt', matrix.name)) }}
          path: tmp/rspec-runtime-${{ matrix.sibling_names[0] }}.log
      - name: Restore second sibling's runtime log
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: specs-runtime-log-${{ matrix.sibling_names[1] }}-${{ hashFiles(format('tmp/spec_{0}_files.txt', matrix.name)) }}
          path: tmp/rspec-runtime-${{ matrix.sibling_names[1] }}.log
      - name: Cache parallel test feature spec runtime log
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: specs-runtime-log-${{ matrix.name }}-${{ hashFiles(format('tmp/spec_{0}_files.txt', matrix.name)) }}
          path: tmp/rspec-runtime-${{ matrix.name }}.log
      - name: Setup parallel tests
        run: RAILS_ENV=test bundle exec rake parallel:drop parallel:create parallel:load_schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
      - name: Run feature specs shard
        run: |
          cat tmp/rspec-runtime-*.log > tmp/rspec-runtime-merged.log 2>/dev/null || true
          if [ -s tmp/rspec-runtime-merged.log ]; then
            GROUP_BY=runtime
            RUNTIME_LOG_ARGS="--runtime-log tmp/rspec-runtime-merged.log --allowed-missing 100"
          else
            GROUP_BY=filesize
            RUNTIME_LOG_ARGS=""
          fi
          RAILS_ENV=test bundle exec parallel_test spec --type rspec --pattern '${{ matrix.pattern }}' -n 12 --only-group ${{ matrix.only_group }} --group-by "$GROUP_BY" $RUNTIME_LOG_ARGS
        env:
          HOST: http://example.com
          CI_SHARD_NAME: ${{ matrix.name }}
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tests-results-${{ matrix.name }}
          path: |
            tmp/capybara
            tmp/rspec-*
          if-no-files-found: ignore
  test_features_autodoc:
    name: Feature Tests using Autodoc
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Cache js dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: node_modules-${{ hashFiles('yarn.lock') }}
          path: node_modules
      - name: Install JS dependencies
        run: yarn install --immutable
      - name: Cache precompiled assets
        id: cache-precompiled-assets
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: assets-invalid-${{ hashFiles('yarn.lock', 'Gemfile.lock', 'app/javascript/**', 'app/assets/**') }}
          path: |
            app/assets/builds
            public/assets
      - uses: ./.github/actions/setup-playwright
      - name: Precompile assets
        if: steps.cache-precompiled-assets.outputs.cache-hit != 'true'
        run: RAILS_ENV=test bundle exec rails assets:precompile
      - name: Setup DB and run autodoc feature specs
        run: RAILS_ENV=test bundle exec rake db:drop db:create db:schema:load; bundle exec rspec spec/features/autodoc
        env:
          HOST: http://example.com
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
          UPLOAD_TO_GH_PAGES: true
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: tmp/capybara/autodoc
        continue-on-error: true # On ne veut pas faire échouer le build si l'upload de l’artifact de la doc échoue
        if: ${{ github.ref == 'refs/heads/production' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: artifacts-capybara-spec-to-doc
          path: tmp/capybara
  deploy_doc:
    name: Deploy spec to doc to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test_features_autodoc]
    continue-on-error: true # On ne veut pas faire échouer le build si le déploiement de la doc échoue
    if: ${{ github.ref == 'refs/heads/production' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true
  test_boot_without_db:
    name: Boot web server without database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Cache js dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: node_modules-${{ hashFiles('yarn.lock') }}
          path: node_modules
      - run: yarn install --immutable
      - run: bin/test_boot
        env:
          HOST: http://www.rdv-test.fr
  notify_mattermost_failure:
    name: "Notify Mattermost on workflow failure on production"
    runs-on: ubuntu-latest
    needs: [rubocop, lint_slim, lint_prettier, brakeman, active_record_doctor, tests, test_boot_without_db]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/production' }}
    steps:
      - uses: mattermost/action-mattermost-notify@ae31bb6f9e26a54336e79696f108a2c91cf55b4e # v2.1.0
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            Erreur dans le [workflow de CI](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) sur la branche production. Le déploiement a probablement été interrompu.
