name: CI
# Cette ligne permet de ne donner aucune permission au GITHUB_TOKEN associé au job qui tourne.
# On n'utilise pas du tout l'api github dans notre CI (aucun job n'a du code qui va créer des issues ou éditer le wiki du repo), donc on n'en a pas besoin.
permissions: {}
on:
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
jobs:
  rubocop:
    name: Ruby linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rubocop --parallel
  lint_slim:
    name: Slim Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec slim-lint app/views/
  lint_prettier:
    name: Lint SCSS with Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
      - name: Cache js dependencies
        uses: actions/cache@v4
        with:
          key: node_modules-${{ hashFiles('yarn.lock') }}
          path: node_modules
      - run: yarn install
      - run: yarn run prettier --check .
  brakeman:
    name: Security Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec brakeman
  active_record_doctor:
    name: active_record_doctor
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: lapin_development
          POSTGRES_PASSWORD: lapin_development
          POSTGRES_DB: lapin_development
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run active_record_doctor:missing_foreign_keys
        run: bundle exec rails active_record_doctor:missing_foreign_keys
        env:
          HOST: http://example.com
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_development
          POSTGRES_PASSWORD: lapin_development
          POSTGRES_DB: lapin_development
      - name: Run active_record_doctor:missing_non_null_constraint
        run: bundle exec rails active_record_doctor:missing_non_null_constraint
        env:
          HOST: http://example.com
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_development
          POSTGRES_PASSWORD: lapin_development
          POSTGRES_DB: lapin_development
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cette strategy permet de lancer deux jobs de feature specs en parallèle pour accélérer l’exécution
        name: [unit, feature_agents, feature_rest]
        include:
          - dirname: "**"
            command: "parallel:spec['spec/(?!features)']"
            name: unit
          - dirname: features/agents
            command: "parallel:spec[spec/features/agents]"
            name: feature_agents
          - dirname: features
            command: "parallel:spec['spec/features/(?!(agents|autodoc))']"
            name: feature_rest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: WitherZuo/set-timezone@v1.0.0
        with:
          timezoneLinux: "Europe/Paris"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Set up Redis
        uses: zhulik/redis-action@1.1.0
      - name: Cache js dependencies
        uses: actions/cache@v4
        with:
          key: node_modules-${{ hashFiles('yarn.lock') }}
          path: node_modules
      - name: Install JS dependencies
        run: yarn install
      - name: Cache precompiled assets
        id: cache-precompiled-assets
        uses: actions/cache@v4
        with:
          key: assets-${{ hashFiles('yarn.lock', 'app/javascript/**') }}
          path: app/assets/builds
      # PLAYWRIGHT
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Install Playwright Chromium browser (with deps)
        run: yarn run playwright install chromium --with-deps --only-shell
      # END PLAYWRIGHT
      - name: Precompile assets
        if: steps.cache-precompiled-assets.outputs.cache-hit != 'true' # Skip if cache was restored
        run: yarn run build
      - name: Prepare runtime log cache key
        run: "ls spec/${{ matrix.dirname }}/**/*.rb > tmp/spec_${{ matrix.name }}_files.txt"
      - name: Cache parallel test feature spec runtime log
        uses: actions/cache@v4
        with:
          key: specs-runtime-log-${{ hashFiles(format('tmp/spec_{0}_files.txt', matrix.name)) }}
          path: tmp/parallel_runtime_rspec.log
        # By setting up and running in the same call, we save the app boot time
      - name: Setup parallel tests and run feature specs
        run: "RAILS_ENV=test bundle exec rake parallel:drop parallel:create parallel:load_schema ${{ matrix.command }}"
        env:
          HOST: http://example.com
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-capybara-${{ matrix.name }}
          path: |
            tmp/capybara
            tmp/rspec-*
          if-no-files-found: ignore
  test_features_autodoc:
    name: Feature Tests using Autodoc
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: WitherZuo/set-timezone@v1.0.0
        with:
          timezoneLinux: "Europe/Paris"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Set up Redis
        uses: zhulik/redis-action@1.1.0
      - name: Cache js dependencies
        uses: actions/cache@v4
        with:
          key: node_modules-${{ hashFiles('yarn.lock') }}
          path: node_modules
      - name: Install JS dependencies
        run: yarn install
      # PLAYWRIGHT
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Install Playwright Chromium browser (with deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn run playwright install --with-deps chromium
      - name: Install Playwright Chromium browser deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn run playwright install-deps chromium
      # END PLAYWRIGHT
      - name: Precompile assets
        run: yarn run build
      - name: Setup parallel tests and run feature specs
        run: RAILS_ENV=test bundle exec rake db:drop db:create db:schema:load; bundle exec rspec spec/features/autodoc
        env:
          HOST: http://example.com
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: lapin_test
          POSTGRES_PASSWORD: lapin_test
          POSTGRES_DB: lapin_test
          UPLOAD_TO_GH_PAGES: true
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tmp/capybara/autodoc
        continue-on-error: true # On ne veut pas faire échouer le build si l'upload de l’artifact de la doc échoue
        if: ${{ github.ref == 'refs/heads/production' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-capybara-spec-to-doc
          path: tmp/capybara
  deploy_doc:
    name: Deploy spec to doc to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test_features_autodoc]
    continue-on-error: true # On ne veut pas faire échouer le build si le déploiement de la doc échoue
    if: ${{ github.ref == 'refs/heads/production' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        continue-on-error: true
  test_boot_without_db:
    name: Boot web server without database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Cache js dependencies
        uses: actions/cache@v4
        with:
          key: node_modules-${{ hashFiles('yarn.lock') }}
          path: node_modules
      - run: yarn install
      - run: bin/test_boot
        env:
          HOST: http://www.rdv-test.fr
  notify_mattermost_failure:
    name: "Notify Mattermost on workflow failure on production"
    runs-on: ubuntu-latest
    needs: [rubocop, lint_slim, lint_prettier, brakeman, active_record_doctor, tests, test_boot_without_db]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/production' }}
    steps:
      - uses: mattermost/action-mattermost-notify@master
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: |
            Erreur dans le [workflow de CI](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) sur la branche production. Le déploiement a probablement été interrompu.
