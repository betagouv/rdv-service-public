- service_name: Assurance retraite (CARSAT)
  name: Compléter et/ou déposer un dossier de demande de retraite
  default_duration_in_min: 60
  location_type: public_office
  restriction_for_rdv: >-
    1 rendez-vous = 1 personne = 1 démarche

    La personne concernée par la démarche doit être présente lors du rendez-vous
    (hors cas de tutelle ou curatelle) Un dossier de demande de retraite se
    commence 6 mois avant la date de départ que vous avez choisi.

    Exemple : pour un départ au 01/07/20XX, la demande de retraite peut être
    commencée à partir du 01/01/20XX.
  instruction_for_rdv: >-
    Munissez vous des éléments suivant :

    - votre téléphone portable

    - vos codes France Connect (Ameli, Impôts, identité numérique, ...)

    - un RIB (Relevé d'Identité Bancaire)

    - votre numéro de sécurité sociale et celui de votre conjoint

    - Vos livrets de familles (ou acte de mariage et actes de naissances des
    enfants)

    - vos 2 derniers avis d'imposition 

    Avoir accès à votre adresse email:

    - installée sur votre téléphone portable

    - connaitre son mot de passe 

    Venir avec les documents selon votre situation personnelle actuelle:

    - 12 dernières fiches de paies

    - Attestations France Travail : périodes d'inscription et montants perçus

    - Dossier MDPH : dernière notification d'attribution

    - Dossier invalidité CPAM : notification et montants
