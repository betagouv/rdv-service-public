- service_name: Allocations familiales (CAF)
  name: Réaliser une demande de RSA
  default_duration_in_min: 45
  location_type: public_office
  restriction_for_rdv: >-
    1 rendez-vous = 1 personne = 1 démarche

    La personne concernée par la démarche doit être présente lors du rendez-vous
    (hors cas de tutelle ou curatelle)
  instruction_for_rdv: >-
    Merci de venir avec les documents suivants :

    - Identifiant et Mots de passe du compte

    - 2 derniers avis d'imposition

    - RIB (Relevé d'identité bancaire)

    - Avoir accès à la boite email ou avoir le mot de passe qui lui est associé

    - Téléphone portable

    - Pièce d'identité (carte d’identité, passeport ou titre de séjour)

    - Carte Vitale (ou une attestation de droit)

    - L'ensemble des revenus de votre foyer des 3 derniers mois accompagné des
    justificatifs (bulletins de salaires, attestations de paiement Pôle Emploi,
    pension alimentaire, indemnités versées par la CPAM ou un autre organisme,
    pension invalidité, retraite...)

    - RIB (Relevé d'Identité Bancaire) Pour les travailleur indépendant :

    - la copie de l’inscription à un registre professionnel (registre du
    commerce, des métiers, à la Maison des artistes, URSSAF...) ou pour les
    artistes - auteurs tout document qui atteste de la affiliation au régime
    social des artistes auteurs (dont le certificat administratif remis par
    l’Urssaf du Limousin) ;

    - le bilan comptable et compte de résultat OU le livre de caisse (recettes
    et dépenses)
