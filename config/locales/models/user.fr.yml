fr:
  activerecord:
    models:
      user:
        one: Usager
        other: Usagers
    attributes:
      user:
        # Pour ne pas perturber les agents avec différentes notions d'email, les champs ont tous le même nom.
        # Notification email et email sont mutuellement exclusifs.
        # Preferred email est soit l'un soit l'autre.
        notification_email: Email
        preferred_email: Email
        email: Email
        organisation: Organisation
        caisse_affiliation: Caisse d'affiliation
        affiliation_number: Numéro d'allocataire
        family_situation: Situation familiale
        number_of_children: Nombre d'enfants
        address_details: Complément d'adresse
        case_number: Numéro de dossier
        responsability_type: Type d'usager
        notify_by_sms: "Accepte les notifications par SMS"
        notify_by_email: "Accepte les notifications par email"
        created_through: "Origine du compte"
        notes: Remarques
        ants_pre_demande_number: &ants_pre_demande_number_label Numéro de pré-demande ANTS
      user/logements:
        sdf: Sans domicile fixe
        heberge: Hébergé
        locataire: Locataire
        en_accession_propriete: En accession à la propriété
        proprietaire: Propriétaire
        autre: Autre
      logement: Logement
      user/caisse_affiliations:
        aucune: Aucune
        caf: CAF
        msa: MSA
      user/family_situations:
        single: Célibataire
        in_a_relationship: En couple
        divorced: Divorcé
      user/responsability_types:
        responsible: "Responsable"
        relative: "Proche"
    errors:
      models:
        user:
          attributes:
            first_name:
              franceconnect_frozen_field_cannot_change: Le prénom ne peut-être changé car il a été certifié par FranceConnect
            birth_name:
              franceconnect_frozen_field_cannot_change: Le nom de naissance ne peut-être changé car il a été certifié par FranceConnect
            birth_date:
              franceconnect_frozen_field_cannot_change: La date de naissance ne peut-être changée car elle a été certifiée par FranceConnect
            password:
              format: "%{message}"
              too_common: "Ce mot de passe fait partie d'une liste de mots de passe fréquemment utilisés et ne permet donc pas d'assurer la sécurité de votre compte. Veuillez en choisir un autre."
              too_short:
                other: "Pour assurer la sécurité de votre compte, votre mot de passe doit faire au moins %{count} caractères"
            ants_pre_demande_number: &ants_pre_demande_number_errors
              blank: doit être renseigné
              invalid_format: doit comporter 10 chiffres et lettres
              unexpected_api_error: n'a pas pu être validé à cause d'une erreur inattendue. Merci de réessayer dans 30 secondes.
            phone_number:
              missing_for_phone_motif: "Le numéro de téléphone est obligatoire car le RDV aura lieu par téléphone"
              format: "%{message}"
    warnings:
      models:
        user:
          ants_pre_demande_number_already_used_html: Ce numéro de pré-demande ANTS est déjà utilisé pour un RDV auprès de %{meeting_point}. Veuillez <a href='%{management_url}' target="_blank">annuler ce RDV<a> avant d'en prendre un nouveau.

  simple_form:
    hints:
      user:
        ants_pre_demande_number_html: Veuillez soumettre au préalable votre demande sur le <a href="https://passeport.ants.gouv.fr/demarches-en-ligne" target="_blank">site de l'ANTS</a> et indiquer le numéro reçu à la fin de la procédure
      agent:
        ants_pre_demande_number_html: Il est fortement recommandé à la personne concernée de soumettre au préalable une demande sur le <a href="https://passeport.ants.gouv.fr/demarches-en-ligne" target="_blank">site de l'ANTS</a>

  # BeneficiaireForm
  activemodel:
    attributes:
      relative_user_form:
        ants_pre_demande_number: *ants_pre_demande_number_label
      beneficiaire_form:
        ants_pre_demande_number: *ants_pre_demande_number_label
    errors:
      models:
        beneficiaire_form:
          attributes:
            ants_pre_demande_number: *ants_pre_demande_number_errors
